version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: increase
    commit-message:
      prefix: "patch"
    schedule:
      interval: "daily"
    # Let new releases age a week before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Let new releases age a week before proposing them (supply-chain safety).
    cooldown:
      default-days: 7
